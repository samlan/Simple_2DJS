<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple2D demo</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; background: #f9fafb; color: #111827; }
    h1 { font-size: 1.2rem; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); }
    canvas { width: 100%; height: 360px; display: block; background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; }
    p { color: #6b7280; font-size: .85rem; }
  </style>
</head>
<body>
  <h1>Simple2D demo</h1>
  <p>Drag to pan · scroll to zoom · double-click to reset.</p>
  <div class="grid">
    <canvas id="functions"></canvas>
    <canvas id="parametric"></canvas>
    <canvas id="scatter"></canvas>
    <canvas id="bars"></canvas>
  </div>

  <script src="src/simple2d.js"></script>
  <script>
    var graphs = [];

    graphs.push(
      Simple2D.create('#functions', { xMin: -2 * Math.PI, xMax: 2 * Math.PI, yMin: -2, yMax: 2,
                                      title: 'Functions', xLabel: 'x', yLabel: 'y' })
        .plotFunction(Math.sin, { label: 'sin(x)' })
        .plotFunction(Math.cos, { label: 'cos(x)', dash: [6, 4] })
        .plotFunction(Math.tan, { label: 'tan(x)', width: 1.5 })
    );

    graphs.push(
      Simple2D.create('#parametric', { xMin: -2, xMax: 2, yMin: -2, yMax: 2, equalAspect: true,
                                       title: 'Parametric: Lissajous & circle' })
        .plotParametric(function (t) { return 1.5 * Math.sin(3 * t); },
                        function (t) { return 1.5 * Math.sin(2 * t); }, { label: 'Lissajous 3:2' })
        .plotParametric(Math.cos, Math.sin, { label: 'unit circle', dash: [4, 4] })
    );

    var pts = [];
    for (var i = 0; i <= 20; i++) pts.push([i, 0.5 * i + 3 * Math.sin(i) + 2]);
    graphs.push(
      Simple2D.create('#scatter', { xMin: -1, xMax: 21, yMin: -2, yMax: 18,
                                    title: 'Data points', xLabel: 'time', yLabel: 'value' })
        .plotPoints(pts, { mode: 'both', label: 'measurements' })
        .plotFunction(function (x) { return 0.5 * x + 2; }, { label: 'trend', color: '#dc2626' })
    );

    graphs.push(
      Simple2D.create('#bars', { title: 'Bar chart', yLabel: 'tonnes' })
        .plotBars([12, 19, 7, 15, 9], { categories: ['Apples', 'Pears', 'Plums', 'Figs', 'Kiwis'], label: '2025 harvest' })
        .fit(0.1)
        .setRange({ yMin: 0 })
    );

    window.addEventListener('resize', function () { graphs.forEach(function (g) { g.resize(); }); });
  </script>
</body>
</html>
